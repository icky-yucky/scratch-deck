<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scratch Deck</title>
<style>
  /* ---- Themes ----
     Every theme is just a set of custom properties: palette, a few structural knobs
     (radius, bevel borders/shadows) and the canvas colors. The canvas colors live here
     too so CSS stays the single source of truth — the JS drawing code reads them back
     out with getComputedStyle rather than hardcoding a second palette. */

  /* Windows 2000 classic. Bevels the authentic way: 1px hard border colors, no gradients,
     no radii. Raised = white top-left / dark bottom-right; sunken = the inverse. */
  :root, :root[data-theme="win2k"] {
    --desktop: #008080;     /* the teal desktop everyone remembers */
    --face: #d4d0c8;        /* the classic 3D face gray */
    --face-lite: #efeae3;   /* eggshell highlight */
    --hilite: #ffffff;
    --shadow: #808080;
    --dkshadow: #404040;
    --text: #000000;
    --muted: #404040;
    --disabled: #808080;
    --title1: #000080;      /* navy title bar */
    --title2: #1084d0;
    --title-ink: #ffffff;
    --field: #ffffff;
    --selection: #000080;

    --font: "MS Sans Serif", Tahoma, Geneva, Verdana, sans-serif;
    --font-size: 11px;
    --radius: 0;
    --btn-border: var(--hilite) var(--dkshadow) var(--dkshadow) var(--hilite);
    --btn-shadow: inset 1px 1px 0 var(--face-lite), inset -1px -1px 0 var(--shadow);
    --btn-border-active: var(--dkshadow) var(--hilite) var(--hilite) var(--dkshadow);
    --btn-shadow-active: inset 1px 1px 0 var(--shadow);
    --btn-press: translate(1px, 1px);
    --sunken-border: var(--shadow) var(--hilite) var(--hilite) var(--shadow);
    --sunken-shadow: inset 1px 1px 0 var(--dkshadow);
    --group-border: 1px solid var(--shadow);
    --group-shadow: 1px 1px 0 var(--hilite), inset -1px -1px 0 var(--hilite);
    --chrome: flex;         /* titlebar / menubar visibility (they are flex rows) */

    --wave-bg: #ffffff;
    --wave-ink: #000080;
    --wave-center: #c0c0c0;
    --ruler-bg: #d4d0c8;
    --ruler-ink: #000000;
    --ruler-tick: #808080;
    --loop-fill: rgba(0,0,128,0.10);
    --loop-edge: #008080;
    --needle-idle: #ff0000;
    --needle-fwd: #000080;
    --needle-rev: #800000;
  }

  /* Windows 2000 after dark: same bevel geometry, inverted luminance. */
  :root[data-theme="win2k-night"] {
    --desktop: #0a2222;
    --face: #3b3b3b;
    --face-lite: #4a4a4a;
    --hilite: #6a6a6a;
    --shadow: #1e1e1e;
    --dkshadow: #0d0d0d;
    --text: #e4e4e4;
    --muted: #b0b0b0;
    --disabled: #7a7a7a;
    --title1: #101038;
    --title2: #2b5580;
    --title-ink: #f0f0f0;
    --field: #191919;
    --selection: #2b5580;

    --font: "MS Sans Serif", Tahoma, Geneva, Verdana, sans-serif;
    --font-size: 11px;
    --radius: 0;
    --btn-border: var(--hilite) var(--dkshadow) var(--dkshadow) var(--hilite);
    --btn-shadow: inset 1px 1px 0 var(--face-lite), inset -1px -1px 0 var(--shadow);
    --btn-border-active: var(--dkshadow) var(--hilite) var(--hilite) var(--dkshadow);
    --btn-shadow-active: inset 1px 1px 0 var(--shadow);
    --btn-press: translate(1px, 1px);
    --sunken-border: var(--shadow) var(--hilite) var(--hilite) var(--shadow);
    --sunken-shadow: inset 1px 1px 0 var(--dkshadow);
    --group-border: 1px solid var(--shadow);
    --group-shadow: 1px 1px 0 var(--hilite), inset -1px -1px 0 var(--hilite);
    --chrome: flex;

    --wave-bg: #191919;
    --wave-ink: #5f8fd0;
    --wave-center: #3a3a3a;
    --ruler-bg: #3b3b3b;
    --ruler-ink: #d8d8d8;
    --ruler-tick: #6a6a6a;
    --loop-fill: rgba(95,143,208,0.14);
    --loop-edge: #38b0b0;
    --needle-idle: #ff4040;
    --needle-fwd: #5f8fd0;
    --needle-rev: #ff4040;
  }

  /* The original flat dark-blue look: no bevels, rounded corners, accent-driven. */
  :root[data-theme="dark"] {
    --desktop: #14161c;
    --face: #1c1f27;
    --face-lite: #232733;
    --hilite: #333a4a;
    --shadow: #333a4a;
    --dkshadow: #333a4a;
    --text: #e6e8ef;
    --muted: #8a90a3;
    --disabled: #5a6070;
    --title1: #1c1f27;
    --title2: #1c1f27;
    --title-ink: #5ec8f8;
    --field: #14161c;
    --selection: #5ec8f8;

    --font: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-size: 12px;
    --radius: 6px;
    --btn-border: var(--hilite);
    --btn-shadow: none;
    --btn-border-active: var(--hilite);
    --btn-shadow-active: none;
    --btn-press: translateY(1px);
    --sunken-border: var(--hilite);
    --sunken-shadow: none;
    --group-border: 1px solid var(--hilite);
    --group-shadow: none;
    --chrome: none;         /* the original had no titlebar/menubar */

    --wave-bg: #0d0f14;
    --wave-ink: #5ec8f8;
    --wave-center: #242a36;
    --ruler-bg: #10121a;
    --ruler-ink: #8a90a3;
    --ruler-tick: #333a4a;
    --loop-fill: rgba(94,200,248,0.12);
    --loop-edge: #f5a623;
    --needle-idle: #ff4d6d;
    --needle-fwd: #5ec8f8;
    --needle-rev: #ff4d6d;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--desktop);
    color: var(--text);
    font-family: var(--font);
    font-size: var(--font-size);
    user-select: none;
  }
  #app {
    display: flex; flex-direction: column; height: 100vh;
    background: var(--face);
    border: 1px solid;
    border-color: var(--btn-border);
    box-shadow: var(--btn-shadow);
  }

  /* Title bar */
  .titlebar {
    display: var(--chrome); align-items: center; gap: 2px;
    margin: 2px; padding: 2px 2px 2px 4px;
    background: linear-gradient(to right, var(--title1), var(--title2));
    color: var(--title-ink); font-weight: bold; font-size: 12px;
  }
  .titlebar .title { flex: 1; }
  .titlebar .tbtn {
    flex: 0 0 auto;
    width: 16px; height: 14px; background: var(--face);
    border: 1px solid; border-color: var(--btn-border);
    box-shadow: var(--btn-shadow);
    color: var(--text); font-size: 9px; line-height: 1;
    display: flex; align-items: center; justify-content: center; font-weight: bold;
  }
  .titlebar .tbtn.close { margin-left: 2px; } /* the classic gap before Close */

  /* Menu bar */
  .menubar {
    display: var(--chrome); gap: 2px; padding: 1px 4px 3px;
    border-bottom: 1px solid var(--shadow);
    box-shadow: 0 1px 0 var(--hilite);
    margin-bottom: 1px;
  }
  .menubar span { padding: 2px 7px; }
  .menubar span:hover { background: var(--selection); color: var(--field); }
  .menubar u { text-decoration: underline; }

  header {
    padding: 6px 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .filename {
    flex: 1; min-width: 120px; padding: 3px 5px;
    background: var(--field); color: var(--text); border-radius: var(--radius);
    border: 1px solid; border-color: var(--sunken-border);
    box-shadow: var(--sunken-shadow);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* Raised button (bevelled in the win2k themes, flat+rounded in the dark one) */
  button, select {
    background: var(--face); color: var(--text); border-radius: var(--radius);
    border: 1px solid; border-color: var(--btn-border);
    box-shadow: var(--btn-shadow);
    padding: 3px 9px; font-family: inherit; font-size: var(--font-size); cursor: default;
    min-height: 21px;
  }
  select { padding: 2px 4px; }
  button:focus { outline: 1px dotted var(--text); outline-offset: -4px; }
  button:active:not(:disabled) {
    border-color: var(--btn-border-active);
    box-shadow: var(--btn-shadow-active);
    transform: var(--btn-press);
  }
  button.toggle.on {
    border-color: var(--btn-border-active);
    box-shadow: var(--btn-shadow-active);
    background-color: var(--face);
    background-image: repeating-conic-gradient(var(--face-lite) 0% 25%, var(--face) 0% 50%);
    background-size: 2px 2px; /* checkerboard = "pressed in" toggle */
  }
  button:disabled { color: var(--disabled); }
  input[type=file] { display: none; }

  /* Waveform: sunken client area */
  .waveform-wrap {
    position: relative; flex: 1; margin: 0 8px; background: var(--wave-bg);
    overflow: hidden; border-radius: var(--radius);
    border: 1px solid; border-color: var(--sunken-border);
    box-shadow: var(--sunken-shadow);
  }
  #ruler { position: absolute; top: 0; left: 0; width: 100%; height: 22px; }
  #waveCanvas { position: absolute; left: 0; width: 100%; top: 22px; touch-action: none; }
  .waveform-wrap.no-file:after {
    content: "Load an audio file to begin"; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%); color: var(--muted); font-size: var(--font-size);
  }

  /* Fixed needle: stays put at center while the waveform scrolls beneath it */
  .needle {
    --needle-color: var(--needle-idle);
    display: none;
    position: absolute; top: 0; bottom: 0; left: 50%; width: 1px;
    background: var(--needle-color); pointer-events: none; z-index: 5;
  }
  .waveform-wrap:not(.no-file) .needle { display: block; }
  .needle::before {
    content: ''; position: absolute; top: 0; left: -4px;
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-top: 7px solid var(--needle-color);
  }

  .status-badge {
    position: absolute; top: 26px; right: 4px; padding: 1px 6px;
    font-size: var(--font-size); background: var(--face); color: var(--text);
    border: 1px solid; border-color: var(--btn-border); border-radius: var(--radius);
    pointer-events: none;
  }
  .status-badge.playing { color: var(--needle-fwd); font-weight: bold; }
  .status-badge.scratching { color: var(--needle-rev); font-weight: bold; }
  .status-badge.paused { color: var(--muted); }

  /* Group boxes with etched borders + legends, like a real properties dialog */
  .transport {
    padding: 8px; display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap;
  }
  .transport .group {
    display: flex; align-items: center; gap: 4px;
    border: var(--group-border); border-radius: var(--radius);
    box-shadow: var(--group-shadow);
    padding: 8px 7px 6px; position: relative;
  }
  .transport .group > .legend {
    position: absolute; top: -6px; left: 6px; padding: 0 3px;
    background: var(--face); color: var(--muted); font-size: var(--font-size);
  }
  .time {
    font-family: "Courier New", monospace; font-size: 12px;
    padding: 2px 5px; background: var(--field); border-radius: var(--radius);
    border: 1px solid; border-color: var(--sunken-border);
    box-shadow: var(--sunken-shadow);
    min-width: 145px; text-align: center;
  }

  label.small { font-size: var(--font-size); color: var(--text); display: flex; align-items: center; gap: 4px; }

  /* Trackbar-style sliders */
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    background: transparent; height: 20px; margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px; background: var(--face); border-radius: var(--radius);
    border: 1px solid; border-color: var(--sunken-border);
    box-shadow: var(--sunken-shadow);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 11px; height: 18px; margin-top: -8px; background: var(--face);
    border-radius: var(--radius);
    border: 1px solid; border-color: var(--btn-border);
    box-shadow: var(--btn-shadow);
  }
  input[type=range]::-moz-range-track {
    height: 4px; background: var(--face);
    border: 1px solid; border-color: var(--sunken-border);
  }
  input[type=range]::-moz-range-thumb {
    width: 9px; height: 16px; border-radius: var(--radius); background: var(--face);
    border: 1px solid; border-color: var(--btn-border);
  }

  /* Status bar with sunken panels */
  footer {
    display: flex; align-items: center; gap: 3px;
    padding: 2px 3px 3px; margin-top: 2px; color: var(--muted); font-size: var(--font-size);
  }
  footer .panel {
    padding: 2px 5px; border-radius: var(--radius);
    border: 1px solid; border-color: var(--sunken-border);
  }
  footer .panel.grow { flex: 1; }
  footer kbd {
    font-family: inherit; font-weight: bold; padding: 0 2px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="titlebar">
    <span class="title">Scratch Deck</span>
    <span class="tbtn">_</span>
    <span class="tbtn">□</span>
    <span class="tbtn close">×</span>
  </div>
  <div class="menubar">
    <span><u>F</u>ile</span>
    <span><u>E</u>dit</span>
    <span><u>V</u>iew</span>
    <span><u>H</u>elp</span>
  </div>
  <header>
    <button id="loadBtn">Open File...</button>
    <input type="file" id="fileInput" accept="audio/*">
    <span class="filename" id="filename">No file loaded</span>
    <label class="small">Theme:
      <select id="themeSelect">
        <option value="win2k">Windows 2000</option>
        <option value="win2k-night">Windows 2000 (Night)</option>
        <option value="dark">Midnight Blue</option>
      </select>
    </label>
  </header>

  <div class="waveform-wrap no-file" id="waveWrap">
    <canvas id="ruler"></canvas>
    <canvas id="waveCanvas"></canvas>
    <div class="needle" id="needle"></div>
    <div class="status-badge paused" id="statusBadge">Paused</div>
  </div>

  <div class="transport">
    <div class="group">
      <span class="legend">Transport</span>
      <button id="playBtn" disabled>▶ Play</button>
      <button id="stopBtn" disabled>■ Stop</button>
      <span class="time" id="timeDisplay"><b>0:00.00</b> / 0:00.00</span>
    </div>
    <div class="group">
      <span class="legend">Loop</span>
      <button id="loopStartBtn" disabled>Set Start</button>
      <button id="loopEndBtn" disabled>Set End</button>
      <button id="loopToggleBtn" class="toggle" disabled>Loop: Off</button>
      <button id="loopClearBtn" disabled>Clear</button>
    </div>
    <div class="group">
      <span class="legend">Zoom</span>
      <button id="zoomOutBtn" disabled>−</button>
      <button id="zoomFitBtn" disabled>Fit</button>
      <button id="zoomInBtn" disabled>+</button>
    </div>
    <div class="group">
      <span class="legend">Speed</span>
      <input type="range" id="speedSlider" min="0.25" max="2" step="0.01" value="1" disabled style="width:110px">
      <span id="speedVal">1.00x</span>
    </div>
    <div class="group">
      <span class="legend">Volume</span>
      <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.9" style="width:80px">
    </div>
  </div>

  <footer>
    <span class="panel grow">
      <kbd>Space</kbd> play/pause &nbsp; <kbd>[</kbd> loop start &nbsp; <kbd>]</kbd> loop end &nbsp;
      <kbd>L</kbd> toggle loop &nbsp; <kbd>Drag</kbd> play fwd/reverse &nbsp;
      <kbd>Shift+drag</kbd> pan &nbsp; <kbd>Wheel/pinch</kbd> zoom
    </span>
    <span class="panel">Ready</span>
  </footer>
</div>

<script>
(() => {
  "use strict";

  // ---------- DOM ----------
  const fileInput = document.getElementById('fileInput');
  const loadBtn = document.getElementById('loadBtn');
  const filenameEl = document.getElementById('filename');
  const waveWrap = document.getElementById('waveWrap');
  const rulerCanvas = document.getElementById('ruler');
  const waveCanvas = document.getElementById('waveCanvas');
  const needleEl = document.getElementById('needle');
  const statusBadge = document.getElementById('statusBadge');
  const playBtn = document.getElementById('playBtn');
  const stopBtn = document.getElementById('stopBtn');
  const timeDisplay = document.getElementById('timeDisplay');
  const loopStartBtn = document.getElementById('loopStartBtn');
  const loopEndBtn = document.getElementById('loopEndBtn');
  const loopToggleBtn = document.getElementById('loopToggleBtn');
  const loopClearBtn = document.getElementById('loopClearBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomFitBtn = document.getElementById('zoomFitBtn');
  const speedSlider = document.getElementById('speedSlider');
  const speedVal = document.getElementById('speedVal');
  const volSlider = document.getElementById('volSlider');
  const themeSelect = document.getElementById('themeSelect');

  // ---------- Theme ----------
  // Canvas colors are defined in CSS alongside the rest of each theme, then read back
  // here, so adding a theme never means editing two palettes that can drift apart.
  let C = {};
  function refreshThemeColors() {
    const cs = getComputedStyle(document.documentElement);
    const get = (n) => cs.getPropertyValue(n).trim();
    C = {
      waveBg: get('--wave-bg'),
      waveInk: get('--wave-ink'),
      waveCenter: get('--wave-center'),
      rulerBg: get('--ruler-bg'),
      rulerInk: get('--ruler-ink'),
      rulerTick: get('--ruler-tick'),
      loopFill: get('--loop-fill'),
      loopEdge: get('--loop-edge'),
      needleIdle: get('--needle-idle'),
      needleFwd: get('--needle-fwd'),
      needleRev: get('--needle-rev'),
      font: get('--font')
    };
  }
  function applyTheme(name) {
    document.documentElement.setAttribute('data-theme', name);
    themeSelect.value = name;
    try { localStorage.setItem('scratchdeck-theme', name); } catch (e) {}
    refreshThemeColors();
    updateNeedleColor();
    if (duration) drawWave();
  }
  themeSelect.addEventListener('change', () => applyTheme(themeSelect.value));

  // ---------- State ----------
  let audioCtx = null;
  let workletNode = null;
  let gainNode = null;
  let sampleRate = 44100;
  let totalSamples = 0;
  let duration = 0;
  let channelPeaks = null; // Float32Array [min,max] pairs at fine resolution, per-channel merged (mono display)
  const PEAK_RES = 20000; // number of min/max buckets across whole file

  let viewStart = 0;      // seconds, left edge of visible window
  let viewDuration = 0;   // seconds, width of visible window
  let playheadSec = 0;
  let isPlaying = false;
  let isScrubbing = false;   // true while actively dragging the waveform to play fwd/rev
  let scrubDirection = 1;    // +1 forward, -1 reverse (last direction while scrubbing)
  let loopStart = null, loopEnd = null, loopEnabled = false;

  let dragging = false;
  let dragMode = null; // 'scrub' | 'pan'
  let dragStartX = 0;
  let dragStartView = 0;
  let lastMoveX = 0;
  let lastMoveTime = 0;
  let scrubTargetSec = 0; // finger-derived target, tracked independently of the engine's position
  // Velocity is measured across a ~70ms window rather than between consecutive events:
  // a two-sample difference is dominated by event-timing jitter, and that jitter lands
  // directly on pitch. A windowed finite difference is far steadier.
  const VEL_WINDOW_MS = 70;
  let scrubHistory = []; // [{t, sec}] recent finger positions
  let scrubEngaged = false; // becomes true once a drag has moved past the deadzone
  const SCRUB_DEADZONE_PX = 3;
  let suppressAutoCenter = false; // true only while shift-panning, so the peek isn't instantly overridden

  // ---------- Canvas sizing ----------
  function resizeCanvases() {
    const rect = waveWrap.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const h = rect.height - 22;
    [rulerCanvas].forEach(c => {
      c.width = rect.width * dpr; c.height = 22 * dpr;
      c.style.height = '22px';
    });
    waveCanvas.width = rect.width * dpr; waveCanvas.height = h * dpr;
    waveCanvas.style.height = h + 'px';
    drawWave();
  }
  window.addEventListener('resize', resizeCanvases);

  // ---------- Load file ----------
  loadBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    await loadFile(file);
  });
  waveWrap.addEventListener('dragover', e => e.preventDefault());
  waveWrap.addEventListener('drop', async e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file) await loadFile(file);
  });

  let audioInitPromise = null;

  async function ensureAudioInit() {
    if (workletNode) return;
    if (!audioInitPromise) audioInitPromise = initAudio();
    try {
      await audioInitPromise;
    } catch (err) {
      audioInitPromise = null;
      audioCtx = null;
      workletNode = null;
      throw err;
    }
  }

  async function loadFile(file) {
    filenameEl.textContent = 'Initializing audio engine...';
    try {
      await ensureAudioInit();
    } catch (err) {
      filenameEl.textContent = 'Audio engine failed to start (see console). If you opened this file directly, try running it via a local server instead.';
      console.error('AudioWorklet init failed:', err);
      return;
    }
    filenameEl.textContent = 'Decoding ' + file.name + ' ...';
    const arrayBuf = await file.arrayBuffer();
    let audioBuffer;
    try {
      audioBuffer = await audioCtx.decodeAudioData(arrayBuf);
    } catch (err) {
      filenameEl.textContent = 'Failed to decode: ' + file.name;
      console.error(err);
      return;
    }
    filenameEl.textContent = file.name;
    await loadIntoEngine(audioBuffer);
  }

  // ---------- Audio engine (AudioWorklet) ----------
  const WORKLET_SRC = `
// Hold: a stopped record is silent (DC), but we want the sound to sustain — "baaaaack".
// So when the drag stops we loop a slice of audio at its NATURAL 1.0x rate: no time-stretch,
// no pitch shift, no granular smearing. The only seam is the loop wrap, hidden by an
// equal-power crossfade against the audio just before the loop start.
const HOLD_LEN = Math.round(sampleRate * 0.28);    // ~280ms of real audio, looped
const HOLD_XFADE = Math.round(sampleRate * 0.035); // ~35ms equal-power crossfade at the wrap
const HOLD_ENTER = 0.03; // |rate| below this: start holding
const HOLD_EXIT  = 0.12; // |rate| above this: release (hysteresis stops mode-flutter)
// Position-error correction gain: a ~250ms time constant. Slow enough that the resulting
// pitch trim is inaudible, which is the point — fast correction is what rings and warbles.
const CORRECT_GAIN = 1 / (0.25 * sampleRate);
class ScratchProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.holding = false;
    this.holdStart = 0;
    this.holdPhase = 0;
    this.channels = [];
    this.length = 0;
    this.position = 0;
    this.playing = false;

  });

  function endDrag(e) {
    if (e && activePointers.has(e.pointerId)) activePointers.delete(e.pointerId);
    if (activePointers.size < 2) pinchStartDist = 0;
    if (!dragging) return;
    if (dragMode === 'scrub' && scrubEngaged) {
      // release resumes normal forward playback from wherever the drag left off
      workletNode.port.postMessage({ type: 'scrubEnd' });
      workletNode.port.postMessage({ type: 'setRate', value: parseFloat(speedSlider.value) });
      workletNode.port.postMessage({ type: 'play' });
      isScrubbing = false;
      isPlaying = true;
      updateStatusBadge();
    }
    dragging = false; dragMode = null; scrubEngaged = false; suppressAutoCenter = false;
  }
  waveCanvas.addEventListener('pointerup', endDrag);
  waveCanvas.addEventListener('pointercancel', endDrag);

  waveCanvas.addEventListener('wheel', (e) => {
    if (!duration) return;
    e.preventDefault();
    zoom(e.deltaY > 0 ? 1.15 : 1/1.15);
  }, { passive: false });

  // ---------- Keyboard shortcuts ----------
  window.addEventListener('keydown', (e) => {
    if (!duration) return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.key === '[') { loopStartBtn.click(); }
    else if (e.key === ']') { loopEndBtn.click(); }
    else if (e.key.toLowerCase() === 'l') { loopToggleBtn.click(); }
  });

  // ---------- Startup ----------
  let savedTheme = null;
  try { savedTheme = localStorage.getItem('scratchdeck-theme'); } catch (e) {}
  const validThemes = ['win2k', 'win2k-night', 'dark'];
  applyTheme(validThemes.includes(savedTheme) ? savedTheme : 'win2k');

})();
</script>
</body>
</html>
